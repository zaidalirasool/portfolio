<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Animated Bar Chart 2 Preview</title>
  <style>
    :root {
      --ink: #191d48;
      --muted: #606373;
      --accent: #3901f1;
      --canvas: #9c80f8;
      --value: #4d5164;
      --scale: 1;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #f5f6fb;
      font-family: Avenir, Arial, sans-serif;
    }

    .viewport {
      width: min(96vw, 1500px);
      height: min(72vh, 760px);
      min-height: 520px;
      position: relative;
      overflow: hidden;
    }

    .scale {
      width: 2004px;
      height: 621.2px;
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%) scale(var(--scale));
      transform-origin: center;
    }

    .graph {
      width: 100%;
      height: 100%;
      position: relative;
      box-shadow: 0px 1.8421878814697266px 7.37px rgba(25, 29, 72, 0.2);
      border-radius: 8px;
      background-color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 36px;
      text-align: left;
      font-size: 22.11px;
      color: var(--ink);
    }

    .frameParent {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 24px;
      max-width: 100%;
    }

    .frameWrapper {
      align-self: stretch;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      flex-shrink: 0;
    }

    .frameGroup {
      display: flex;
      align-items: flex-start;
      gap: 24px;
    }

    .toggleSelectorListElementWrapper {
      display: flex;
      align-items: center;
      justify-content: flex-end;
    }

    .toggleSelectorListElement {
      display: flex;
      align-items: flex-start;
      gap: 8px;
    }

    .toggleSelector {
      height: 24px;
      width: 24px;
      position: relative;
      border-radius: 33.16px;
      overflow: hidden;
      flex-shrink: 0;
    }

    .rectangle10Copy31Parent,
    .rectangle10Copy31,
    .rectangle10Copy312 {
      position: absolute;
      inset: 0;
    }

    .rectangle10Copy31,
    .rectangle10Copy312 {
      border-radius: 46.05px;
      background-color: var(--accent);
    }

    .rectangle10Copy312 {
      background-color: var(--canvas);
    }

    .rectangle10Copy32 {
      position: absolute;
      height: 80%;
      width: 44.58%;
      top: 10%;
      right: 5.42%;
      bottom: 10%;
      left: 50%;
      box-shadow: 0px 1.8421878814697266px 7.37px rgba(25, 29, 72, 0.2);
      border-radius: 46.05px;
      background-color: #fff;
      display: none;
    }

    .guidedWizardParent {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
    }

    .guidedWizard {
      align-self: stretch;
      position: relative;
      line-height: 22.11px;
      flex-shrink: 0;
    }

    .optionalElementLevelHelper,
    .spacer {
      width: 2571.7px;
      position: relative;
      display: none;
      flex-shrink: 0;
    }

    .optionalElementLevelHelper {
      font-size: 25.79px;
      line-height: 36.84px;
      color: #6e7381;
    }

    .spacer {
      height: 29.5px;
    }

    .graph2 {
      width: 1932px;
      height: 501.2px;
      position: relative;
      flex-shrink: 0;
      text-align: right;
      color: var(--muted);
    }

    .graphLines {
      position: absolute;
      top: 0.16px;
      left: 0;
      width: 1931px;
      height: 470px;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      justify-content: space-between;
      gap: 20px;
    }

    .graphLine,
    .graphLine5 {
      align-self: stretch;
      height: 27.6px;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 14.7px;
    }

    .graphLine5 {
      height: 31.3px;
    }

    .m,
    .m3 {
      position: relative;
      line-height: 29.48px;
      flex-shrink: 0;
    }

    .m3 {
      width: 64.5px;
      display: inline-block;
    }

    .graphLineChild,
    .graphLineInner,
    .graphLineChild2 {
      height: 0;
      position: relative;
      border-top: 1.8px dashed #f0f0f3;
      border-image: repeating-linear-gradient(to right, #f0f0f3 0 4px, transparent 4px 8px) 1;
      max-height: 100%;
      flex-shrink: 0;
    }

    .graphLineChild {
      width: 1851px;
    }

    .graphLineInner,
    .graphLineChild2 {
      flex: 1;
      max-width: 100%;
      overflow: hidden;
    }

    .upsellAllParent {
      position: absolute;
      top: 471.15px;
      left: 69.97px;
      display: flex;
      align-items: flex-start;
      padding: 0 180px;
      gap: 553px;
      text-align: left;
    }

    .upsellAll {
      position: relative;
      line-height: 29.48px;
    }

    .bars {
      position: absolute;
      top: 0;
      left: 79.52px;
      width: 1852px;
      height: 455px;
      display: flex;
      align-items: flex-end;
      padding: 0 56px;
      gap: 323px;
    }

    .bar,
    .bar3 {
      position: relative;
      display: flex;
      align-items: flex-end;
      gap: 16px;
    }

    .barChild,
    .barItem,
    .barInner,
    .rectangleDiv,
    .barChild2,
    .barChild3 {
      width: 156px;
      position: relative;
      border-radius: 8px 8px 0 0;
      transform-origin: bottom center;
      transform: scaleY(0);
      animation: grow-up 1700ms cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    .barChild { height: 377px; background: var(--accent); animation-delay: 260ms; }
    .barItem { height: 193px; background: var(--canvas); animation-delay: 420ms; }
    .barInner { height: 335px; background: var(--accent); animation-delay: 580ms; }
    .rectangleDiv { height: 237px; background: var(--canvas); animation-delay: 740ms; }
    .barChild2 { height: 365px; background: var(--accent); animation-delay: 900ms; }
    .barChild3 { height: 285px; background: var(--canvas); animation-delay: 1060ms; }

    .value {
      width: 156px;
      height: 30px;
      position: absolute;
      bottom: 0;
      color: var(--value);
      font-size: 24px;
      font-weight: 900;
      line-height: 29.48px;
      text-align: center;
      display: inline-block;
      pointer-events: none;
      opacity: 0;
      transform: translateY(0);
      z-index: 4;
      animation: value-rise 1700ms cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    .v1 { left: 0; animation-delay: 260ms; --rise: -381px; }
    .v2 { left: 172px; animation-delay: 420ms; --rise: -197px; }
    .v3 { left: 0; animation-delay: 580ms; --rise: -339px; }
    .v4 { left: 172px; animation-delay: 740ms; --rise: -241px; }
    .v5 { left: 0; animation-delay: 900ms; --rise: -369px; }
    .v6 { left: 172px; animation-delay: 1060ms; --rise: -289px; }

    @keyframes grow-up {
      to { transform: scaleY(1); }
    }

    @keyframes value-rise {
      to {
        opacity: 1;
        transform: translateY(var(--rise));
      }
    }
  </style>
</head>
<body>
  <div class="viewport" id="viewport">
    <div class="scale" id="scale">
      <main class="graph">
        <div class="frameParent">
          <div class="frameWrapper">
            <div class="frameGroup">
              <div class="toggleSelectorListElementWrapper">
                <div class="toggleSelectorListElement">
                  <div class="toggleSelector">
                    <div class="rectangle10Copy31Parent">
                      <div class="rectangle10Copy31"></div>
                      <div class="rectangle10Copy32"></div>
                    </div>
                  </div>
                  <div class="guidedWizardParent">
                    <div class="guidedWizard">Guided wizard</div>
                    <div class="optionalElementLevelHelper">Optional element-level helper text lorem ipsum dolor sit.</div>
                    <div class="spacer"></div>
                  </div>
                </div>
              </div>
              <div class="toggleSelectorListElementWrapper">
                <div class="toggleSelectorListElement">
                  <div class="toggleSelector">
                    <div class="rectangle10Copy31Parent">
                      <div class="rectangle10Copy312"></div>
                      <div class="rectangle10Copy32"></div>
                    </div>
                  </div>
                  <div class="guidedWizardParent">
                    <div class="guidedWizard">Canvas builder</div>
                    <div class="optionalElementLevelHelper">Optional element-level helper text lorem ipsum dolor sit.</div>
                    <div class="spacer"></div>
                  </div>
                </div>
              </div>
            </div>
          </div>

          <div class="graph2">
            <div class="graphLines">
              <div class="graphLine"><div class="m">5m</div><div class="graphLineChild"></div></div>
              <div class="graphLine"><div class="m">4m</div><div class="graphLineChild"></div></div>
              <div class="graphLine"><div class="m3">3m</div><div class="graphLineInner"></div></div>
              <div class="graphLine"><div class="m3">2m</div><div class="graphLineInner"></div></div>
              <div class="graphLine5"><div class="m3">1m</div><div class="graphLineChild2"></div></div>
              <div class="graphLine"><div class="m3">0</div><div class="graphLineInner"></div></div>
            </div>

            <div class="upsellAllParent">
              <div class="upsellAll">Upsell All</div>
              <div class="upsellAll">Cross-Sell</div>
              <div class="upsellAll">Subscription Widget</div>
            </div>

            <div class="bars">
              <div class="bar" style="height:377px">
                <div class="barChild"></div>
                <div class="barItem"></div>
                <div class="value v1">4m 14s</div>
                <div class="value v2">2m 14s</div>
              </div>
              <div class="bar" style="height:335px">
                <div class="barInner"></div>
                <div class="rectangleDiv"></div>
                <div class="value v3">3m 43s</div>
                <div class="value v4">2m 40s</div>
              </div>
              <div class="bar3" style="height:365px">
                <div class="barChild2"></div>
                <div class="barChild3"></div>
                <div class="value v5">4m 09s</div>
                <div class="value v6">3m 26s</div>
              </div>
            </div>
          </div>

          <div style="width:1834.8px;display:none"></div>
        </div>
      </main>
    </div>
  </div>

  <script>
    const viewport = document.getElementById("viewport")
    const setScale = () => {
      const rect = viewport.getBoundingClientRect()
      const availableWidth = Math.max(0, rect.width - 32)
      const availableHeight = Math.max(0, rect.height - 32)
      const scale = Math.min(availableWidth / 2004, availableHeight / 621.2)
      document.documentElement.style.setProperty("--scale", scale)
    }
    setScale()
    new ResizeObserver(setScale).observe(viewport)
  </script>
</body>
</html>
